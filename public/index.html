<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0a0c0f; --surface:#111418; --border:#1e2530; --accent:#00ff9d; --accent2:#00c8ff;
      --text:#c8d6e5; --muted:#4a5568;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text); font-family:'Share Tech Mono', monospace;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
      pointer-events:none; z-index:100;
    }
    body::after {
      content:''; position:fixed; inset:0;
      background-image:linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }
    .panel {
      position:relative; z-index:1; width:min(460px, 94vw); background:var(--surface);
      border:1px solid var(--border); border-radius:4px; padding:2rem;
      box-shadow:0 0 0 1px rgba(0,255,157,0.05), 0 0 40px rgba(0,255,157,0.04), 0 20px 60px rgba(0,0,0,0.6);
    }
    .panel::before, .panel::after {
      content:''; position:absolute; width:12px; height:12px; border-color:var(--accent); border-style:solid;
    }
    .panel::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
    .panel::after { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
    header { margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
    .logo {
      font-family:'Orbitron', sans-serif; font-size:1.25rem; font-weight:900; color:var(--accent); letter-spacing:0.05em;
      text-shadow:0 0 20px rgba(0,255,157,0.4);
    }
    .logo span { color:var(--accent2); }
    .sub { margin-top:0.35rem; font-size:0.72rem; color:var(--muted); letter-spacing:0.05em; }
    .section-title { font-size:0.68rem; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; margin-bottom:0.75rem; }
    .menu-grid { display:grid; grid-template-columns:1fr; gap:0.75rem; }
    .menu-btn {
      display:block; width:100%; padding:1rem; text-decoration:none; background:var(--bg); color:var(--text);
      border:1px solid var(--border); border-radius:4px; transition:all 0.2s;
    }
    .menu-btn:hover { border-color:var(--accent); color:var(--accent); box-shadow:0 0 16px rgba(0,255,157,0.2); }
    .menu-btn strong { display:block; font-family:'Orbitron', sans-serif; font-size:0.78rem; letter-spacing:0.08em; }
    .menu-btn span { display:block; margin-top:0.3rem; font-size:0.72rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="panel">
    <header>
      <div class="logo">MC<span>CTL</span></div>
      <div class="sub">Server Control Home</div>
    </header>

    <div class="section-title">// Select Page</div>
    <div class="menu-grid">
      <a class="menu-btn" href="/difficulty.html">
        <strong>Difficulty Control</strong>
        <span>Set peaceful, easy, normal, or hard</span>
      </a>
      <a class="menu-btn" href="/players.html">
        <strong>Online Players</strong>
        <span>View who is online and session duration</span>
      </a>
    </div>
  </div>
</body>
</html>
