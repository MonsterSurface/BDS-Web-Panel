<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC Online Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0a0c0f; --surface:#111418; --border:#1e2530; --accent:#00ff9d; --accent2:#00c8ff;
      --warn:#ff6b35; --text:#c8d6e5; --muted:#4a5568; --easy:#4ade80;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Share Tech Mono', monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    body::before { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px); pointer-events:none; z-index:100; }
    body::after { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
    .panel { position:relative; z-index:1; width:min(540px, 94vw); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:2rem; box-shadow:0 0 0 1px rgba(0,255,157,0.05), 0 0 40px rgba(0,255,157,0.04), 0 20px 60px rgba(0,0,0,0.6); }
    .panel::before, .panel::after { content:''; position:absolute; width:12px; height:12px; border-color:var(--accent); border-style:solid; }
    .panel::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
    .panel::after { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
    header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1.25rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
    .logo { font-family:'Orbitron', sans-serif; font-size:1.25rem; font-weight:900; color:var(--accent); letter-spacing:0.05em; text-shadow:0 0 20px rgba(0,255,157,0.4); }
    .logo span { color:var(--accent2); }
    .nav-link { color:var(--accent2); text-decoration:none; font-size:0.72rem; margin-left:auto; }
    .status { font-size:0.72rem; color:var(--muted); margin-bottom:0.75rem; }
    .refresh-btn { width:100%; margin-bottom:0.9rem; padding:0.72rem; background:transparent; border:1px solid var(--accent); border-radius:3px; color:var(--accent); font-family:'Orbitron', sans-serif; font-size:0.78rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; }
    .refresh-btn:disabled { opacity:0.5; cursor:not-allowed; }
    .list { border:1px solid var(--border); border-radius:4px; overflow:hidden; }
    .row { display:grid; grid-template-columns:1fr auto; gap:0.8rem; padding:0.72rem 0.8rem; border-bottom:1px solid var(--border); background:var(--bg); }
    .row:last-child { border-bottom:0; }
    .name { color:var(--easy); }
    .time { color:var(--accent2); font-size:0.84rem; }
    .empty, .error { padding:0.9rem; background:var(--bg); color:var(--muted); }
    .error { color:var(--warn); }
  </style>
</head>
<body>
  <div class="panel">
    <header>
      <div class="logo">MC<span>CTL</span></div>
      <div style="font-size:0.72rem;color:var(--muted);letter-spacing:0.05em;">Online Players</div>
      <a class="nav-link" href="/">HOME</a>
    </header>

    <div id="status" class="status">Waiting for refresh...</div>
    <button id="refresh" class="refresh-btn" onclick="loadPlayers()">⟳ REFRESH PLAYERS</button>

    <div id="list" class="list">
      <div class="empty">No data loaded yet.</div>
    </div>
  </div>

  <script>
    function formatDuration(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function renderPlayers(players) {
      const list = document.getElementById('list');

      if (!players.length) {
        list.innerHTML = '<div class="empty">No players are currently online.</div>';
        return;
      }

      list.innerHTML = players.map((p) => `
        <div class="row">
          <div class="name">${p.name}</div>
          <div class="time">${formatDuration(p.onlineForSeconds)}</div>
        </div>
      `).join('');
    }

    async function loadPlayers() {
      const status = document.getElementById('status');
      const refresh = document.getElementById('refresh');
      const list = document.getElementById('list');

      refresh.disabled = true;
      status.textContent = 'Loading player sessions...';

      try {
        const res = await fetch('/players-online');
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          list.innerHTML = `<div class="error">${data.error || 'Failed to load players.'}</div>`;
          status.textContent = 'Failed to fetch player list.';
          return;
        }

        renderPlayers(Array.isArray(data.players) ? data.players : []);
        status.textContent = `Last updated: ${new Date().toLocaleTimeString('en-GB', { hour12: false })}`;
      } catch (err) {
        list.innerHTML = `<div class="error">Network error: ${err.message}</div>`;
        status.textContent = 'Failed to fetch player list.';
      } finally {
        refresh.disabled = false;
      }
    }

    loadPlayers();
    setInterval(loadPlayers, 15000);
  </script>
</body>
</html>
