<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC Difficulty Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0a0c0f; --surface:#111418; --border:#1e2530; --accent:#00ff9d; --accent2:#00c8ff;
      --warn:#ff6b35; --text:#c8d6e5; --muted:#4a5568; --easy:#4ade80; --normal:#60a5fa;
      --hard:#f97316; --peaceful:#a78bfa;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Share Tech Mono', monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    body::before { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px); pointer-events:none; z-index:100; }
    body::after { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
    .panel { position:relative; z-index:1; width:min(460px, 94vw); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:2rem; box-shadow:0 0 0 1px rgba(0,255,157,0.05), 0 0 40px rgba(0,255,157,0.04), 0 20px 60px rgba(0,0,0,0.6); }
    .panel::before, .panel::after { content:''; position:absolute; width:12px; height:12px; border-color:var(--accent); border-style:solid; }
    .panel::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
    .panel::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
    header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1.75rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
    .logo { font-family:'Orbitron', sans-serif; font-size:1.25rem; font-weight:900; color:var(--accent); letter-spacing:0.05em; text-shadow:0 0 20px rgba(0,255,157,0.4); }
    .logo span { color:var(--accent2); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); margin-left:auto; transition:background 0.3s, box-shadow 0.3s; }
    .status-dot.online { background:var(--easy); box-shadow:0 0 8px var(--easy); }
    .status-dot.error  { background:var(--warn); box-shadow:0 0 8px var(--warn); }
    .nav-link { color:var(--accent2); text-decoration:none; font-size:0.72rem; }
    .section-title { font-size:0.68rem; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; margin-bottom:0.75rem; }
    .difficulty-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin-bottom:1.5rem; }
    .diff-btn { position:relative; display:flex; flex-direction:column; align-items:center; gap:0.3rem; padding:1rem 0.5rem; background:var(--bg); border:1px solid var(--border); border-radius:4px; color:var(--muted); cursor:pointer; font-family:'Share Tech Mono', monospace; font-size:0.8rem; letter-spacing:0.06em; text-transform:uppercase; transition:all 0.2s; }
    .diff-btn .icon { font-size:1.5rem; filter:grayscale(1); transition:filter 0.2s; }
    .diff-btn .name { font-family:'Orbitron', sans-serif; font-size:0.7rem; font-weight:700; }
    .diff-btn .cmd  { font-size:0.65rem; color:var(--muted); }
    .diff-btn[data-diff="peaceful"]:hover, .diff-btn[data-diff="peaceful"].active { border-color:var(--peaceful); color:var(--peaceful); box-shadow:0 0 16px rgba(167,139,250,0.25); }
    .diff-btn[data-diff="easy"]:hover, .diff-btn[data-diff="easy"].active { border-color:var(--easy); color:var(--easy); box-shadow:0 0 16px rgba(74,222,128,0.25); }
    .diff-btn[data-diff="normal"]:hover, .diff-btn[data-diff="normal"].active { border-color:var(--normal); color:var(--normal); box-shadow:0 0 16px rgba(96,165,250,0.25); }
    .diff-btn[data-diff="hard"]:hover, .diff-btn[data-diff="hard"].active { border-color:var(--hard); color:var(--hard); box-shadow:0 0 16px rgba(249,115,22,0.25); }
    .diff-btn:hover .icon, .diff-btn.active .icon { filter:grayscale(0); }
    .diff-btn.active::before { content:'✓'; position:absolute; top:4px; right:6px; font-size:0.65rem; }
    .send-btn { width:100%; padding:0.75rem; background:transparent; border:1px solid var(--accent); border-radius:3px; color:var(--accent); font-family:'Orbitron', sans-serif; font-size:0.8rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
    .send-btn::before { content:''; position:absolute; inset:0; background:var(--accent); transform:translateX(-100%); transition:transform 0.2s; z-index:0; }
    .send-btn:hover::before { transform:translateX(0); }
    .send-btn:hover { color:var(--bg); }
    .send-btn span { position:relative; z-index:1; }
    .send-btn:disabled { opacity:0.4; cursor:not-allowed; border-color:var(--muted); color:var(--muted); }
    .send-btn:disabled::before { display:none; }
    #log { margin-top:1.25rem; background:var(--bg); border:1px solid var(--border); border-radius:3px; padding:0.75rem; font-size:0.75rem; line-height:1.7; min-height:3.5rem; max-height:120px; overflow-y:auto; color:var(--muted); }
    #log .entry.ok { color:var(--easy); } #log .entry.err { color:var(--warn); } #log .entry.info { color:var(--accent2); }
    #log .ts { color:var(--muted); margin-right:0.5rem; }
  </style>
</head>
<body>
<div class="panel">
  <header>
    <div class="logo">MC<span>CTL</span></div>
    <div style="font-size:0.72rem;color:var(--muted);letter-spacing:0.05em;">Difficulty Control</div>
    <a class="nav-link" href="/">HOME</a>
    <div class="status-dot" id="statusDot"></div>
  </header>

  <div class="section-title">// Select Difficulty</div>
  <div class="difficulty-grid">
    <button class="diff-btn" data-diff="peaceful" onclick="selectDiff(this)"><span class="icon">☮️</span><span class="name">Peaceful</span><span class="cmd">/difficulty peaceful</span></button>
    <button class="diff-btn" data-diff="easy" onclick="selectDiff(this)"><span class="icon">🌿</span><span class="name">Easy</span><span class="cmd">/difficulty easy</span></button>
    <button class="diff-btn" data-diff="normal" onclick="selectDiff(this)"><span class="icon">⚔️</span><span class="name">Normal</span><span class="cmd">/difficulty normal</span></button>
    <button class="diff-btn" data-diff="hard" onclick="selectDiff(this)"><span class="icon">💀</span><span class="name">Hard</span><span class="cmd">/difficulty hard</span></button>
  </div>

  <button class="send-btn" id="sendBtn" onclick="sendCommand()" disabled><span id="sendLabel">▶ SEND COMMAND</span></button>
  <div id="log"><span style="color:var(--muted);font-size:0.7rem;">» Select a difficulty to begin...</span></div>
</div>

<script>
  let chosen = null;

  function ts() {
    return new Date().toLocaleTimeString('en-GB', { hour12: false });
  }

  function log(msg, type = 'info') {
    const logEl = document.getElementById('log');
    if (logEl.querySelector('span[style]')) logEl.innerHTML = '';
    const e = document.createElement('div');
    e.className = `entry ${type}`;
    e.innerHTML = `<span class="ts">[${ts()}]</span>${msg}`;
    logEl.appendChild(e);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function selectDiff(el) {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    chosen = el.dataset.diff;
    document.getElementById('sendBtn').disabled = false;
  }

  async function sendCommand() {
    if (!chosen) return;

    const btn = document.getElementById('sendBtn');
    const lbl = document.getElementById('sendLabel');
    const dot = document.getElementById('statusDot');

    btn.disabled = true;
    lbl.textContent = '⟳ SENDING…';
    dot.className = 'status-dot';
    log(`Sending: /difficulty ${chosen}`, 'info');

    try {
      const res = await fetch('/send-command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: `difficulty ${chosen}` }),
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        dot.className = 'status-dot online';
        log(`✓ Difficulty set to <strong>${chosen}</strong>`, 'ok');
      } else {
        dot.className = 'status-dot error';
        log(`✗ ${data.error || 'Unknown error'}`, 'err');
      }
    } catch (err) {
      dot.className = 'status-dot error';
      log(`✗ Network error: ${err.message}`, 'err');
    } finally {
      btn.disabled = false;
      lbl.textContent = '▶ SEND COMMAND';
    }
  }
</script>
</body>
</html>
